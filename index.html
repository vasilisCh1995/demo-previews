<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Demo Previews</title>
<style>
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f6fb8;color:#fff;
    min-height:100vh;margin:0;display:grid;place-items:center;text-align:center;padding:24px}
  .box{max-width:440px}
  h1{font-size:26px;letter-spacing:-.5px;margin-bottom:12px}
  p{opacity:.9;line-height:1.6}
  .dot{width:54px;height:54px;border-radius:15px;background:#fff;color:#0f6fb8;display:grid;
    place-items:center;font-size:28px;font-weight:800;margin:0 auto 18px}
</style>
</head>
<body>
  <div class="box">
    <div class="dot">+</div>
    <h1>Demo Previews</h1>
    <p>Αυτή η σελίδα φιλοξενεί ιδιωτικά demo previews. Αν έχετε λάβει προσωπικό σύνδεσμο, ανοίξτε τον απευθείας για να δείτε το demo που ετοιμάσαμε για εσάς.</p>
  </div>
</body>
</html>
