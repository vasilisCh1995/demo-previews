const sent=JSON.parse(localStorage.getItem('sent_sites')||'{}');
const F={q:'',mobile:false,ig:false,unsent:false};
const enc=encodeURIComponent;
function greet(){return new Date().getHours()<12?'Καλημέρα σας':'Καλησπέρα σας';}
function msg(p){return p.opener.replace('{greet}',greet())+(p.url?'\n\n'+p.url:'');}
function render(){const tb=document.getElementById('tb');tb.innerHTML='';let shown=0;
  P.forEach((p,i)=>{
    if(F.q){const q=F.q.toLowerCase();if(!((p.name||'').toLowerCase().includes(q)||(p.cat||'').toLowerCase().includes(q)||(p.area||'').toLowerCase().includes(q)))return;}
    if(F.mobile&&!p.mobile)return; if(F.ig&&!p.ig)return; if(F.unsent&&sent[p.file])return;
    shown++;
    const tel='tel:'+(p.phone||'').replace(/\s/g,''); const wa='https://wa.me/'+p.digits+'?text='+enc(msg(p));
    const tr=document.createElement('tr');tr.className=sent[p.file]?'sent':'';
    tr.innerHTML='<td class="rank">'+(i+1)+'</td>'+
      '<td><div class="nm">'+p.name+'</div><div class="rank">'+(p.phone||'')+(p.mobile?' 📱':'')+'</div><div class="op">'+msg(p).split('\n')[0]+'</div></td>'+
      '<td>'+(p.area||'')+'<br><span class="rank">'+(p.cat||'')+'</span></td>'+
      '<td><div class="btns">'+
        '<a class="b cl" href="'+tel+'">📞 Κλήση</a>'+
        '<a class="b wa" target="_blank" href="'+wa+'">WhatsApp</a>'+
        (p.ig?'<button class="b ig" onclick="ig('+i+')">IG</button>':'')+
        (p.url?'<a class="b st" target="_blank" href="'+p.url+'">Δες site</a>':'')+
        '<button class="b cp" onclick="cp('+i+')">Copy</button>'+
        '<button class="b sd" onclick="tg('+i+')">Sent</button>'+
      '</div></td>';
    tb.appendChild(tr);
  });
  document.getElementById('shown').textContent=shown;
  document.getElementById('sc').textContent=Object.values(sent).filter(Boolean).length;
}
function cp(i){navigator.clipboard.writeText(msg(P[i]));}
function ig(i){navigator.clipboard.writeText(msg(P[i]));window.open(P[i].ig,'_blank');}
function tg(i){const f=P[i].file;sent[f]=!sent[f];localStorage.setItem('sent_sites',JSON.stringify(sent));render();}
function reset(){if(confirm('Reset sent;')){localStorage.removeItem('sent_sites');for(const k in sent)delete sent[k];render();}}
document.getElementById('q').addEventListener('input',e=>{F.q=e.target.value;render();});
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;F[b.dataset.f]=!F[b.dataset.f];b.classList.toggle('active',F[b.dataset.f]);render();});
render();
</script></body></html>
